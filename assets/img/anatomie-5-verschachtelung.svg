<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family="ui-monospace, 'SF Mono', Consolas, monospace">
  <title>Links falsch: div wird nach h1 geschlossen. Rechts richtig: div liegt vollständig in h1</title>
  <rect width="760" height="260" fill="#ffffff"/>
  <!-- falsch -->
  <rect x="20" y="20" width="340" height="150" rx="8" fill="#1e2432"/>
  <g font-size="22">
    <text x="40" y="60" fill="#ff7b72">&lt;h1&gt;</text>
    <text x="70" y="95" fill="#e6edf3"><tspan fill="#79c0ff">&lt;div&gt;</tspan>Hallo<tspan fill="#ff7b72">&lt;/h1&gt;</tspan></text>
    <rect x="34" y="112" width="96" height="34" rx="4" fill="#f85149" opacity="0.35"/>
    <text x="40" y="136" fill="#79c0ff">&lt;/div&gt;</text>
  </g>
  <!-- richtig -->
  <rect x="400" y="20" width="340" height="150" rx="8" fill="#1e2432"/>
  <g font-size="22">
    <text x="420" y="60" fill="#ff7b72">&lt;h1&gt;</text>
    <text x="450" y="95" fill="#e6edf3"><tspan fill="#79c0ff">&lt;div&gt;</tspan>Hallo<tspan fill="#79c0ff">&lt;/div&gt;</tspan></text>
    <text x="420" y="136" fill="#ff7b72">&lt;/h1&gt;</text>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">
    <text x="190" y="248" font-size="15" fill="#cf222e">falsch verschachtelt</text>
    <text x="570" y="248" font-size="15" fill="#1a7f37">richtig verschachtelt</text>
  </g>
  <path transform="translate(190,208)" d="M-12,-12 L12,12 M12,-12 L-12,12" fill="none" stroke="#cf222e" stroke-width="6" stroke-linecap="round"/>
  <path transform="translate(570,208)" d="M-14,0 L-5,10 L15,-13" fill="none" stroke="#1a7f37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
