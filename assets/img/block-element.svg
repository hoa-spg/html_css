<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Block-Elemente nehmen die gesamte verfügbare Breite ein und stehen untereinander</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
  </defs>
  <rect width="600" height="420" fill="#ffffff"/>
  <line x1="40" y1="20" x2="40" y2="400" stroke="#57606a" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="560" y1="20" x2="560" y2="400" stroke="#57606a" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M50,40 L550,40" stroke="#1f2328" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="215" y="28" width="170" height="24" fill="#ffffff"/>
  <text x="300" y="46" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">verfügbare Breite</text>
  <g font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">
    <rect x="40" y="75" width="520" height="56" rx="6" fill="#58a6ff"/><text x="300" y="110">Block-Element</text>
    <rect x="40" y="151" width="520" height="56" rx="6" fill="#58a6ff"/><text x="300" y="186">Block-Element</text>
    <rect x="40" y="227" width="520" height="56" rx="6" fill="#58a6ff"/><text x="300" y="262">Block-Element</text>
    <rect x="40" y="303" width="520" height="56" rx="6" fill="#58a6ff"/><text x="300" y="338">Block-Element</text>
  </g>
</svg>
