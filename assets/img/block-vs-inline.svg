<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Block-Elemente stapeln sich untereinander, Inline-Elemente stehen nebeneinander in der Zeile</title>
  <rect width="400" height="440" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#1f2328">Block</text>
  <g fill="#58a6ff">
    <rect x="30" y="56" width="340" height="34" rx="4"/>
    <rect x="30" y="98" width="340" height="34" rx="4"/>
    <rect x="30" y="140" width="340" height="34" rx="4"/>
    <rect x="30" y="182" width="340" height="34" rx="4"/>
  </g>
  <text x="30" y="280" font-size="20" font-weight="700" fill="#1f2328">Inline</text>
  <g fill="#f0883e">
    <rect x="30" y="296" width="110" height="34" rx="4"/>
    <rect x="148" y="296" width="60" height="34" rx="4"/>
    <rect x="216" y="296" width="100" height="34" rx="4"/>
    <rect x="30" y="338" width="80" height="34" rx="4"/>
    <rect x="118" y="338" width="130" height="34" rx="4"/>
  </g>
</svg>
