<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Browser-Marktanteile 2023: Chrome 63 %, Safari 14,4 %, Internet Explorer und Edge 8 %, Firefox 5,1 %, Opera 1,8 %</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <!-- Skala: 100 % = 600px, Balken ab x=200 -->
  <g stroke="#eaeef2" stroke-width="1">
    <line x1="200" y1="20" x2="200" y2="250"/><line x1="350" y1="20" x2="350" y2="250"/>
    <line x1="500" y1="20" x2="500" y2="250"/><line x1="650" y1="20" x2="650" y2="250"/>
  </g>
  <g font-size="17" fill="#1f2328" text-anchor="end">
    <text x="188" y="52">Chrome</text>
    <text x="188" y="97">Safari</text>
    <text x="188" y="142">IE &amp; Edge</text>
    <text x="188" y="187">Firefox</text>
    <text x="188" y="232">Opera</text>
  </g>
  <g>
    <rect x="200" y="30" width="378" height="30" rx="3" fill="#0969da"/>
    <rect x="200" y="75" width="86.4" height="30" rx="3" fill="#0969da"/>
    <rect x="200" y="120" width="48" height="30" rx="3" fill="#0969da"/>
    <rect x="200" y="165" width="30.6" height="30" rx="3" fill="#0969da"/>
    <rect x="200" y="210" width="10.8" height="30" rx="3" fill="#0969da"/>
  </g>
  <g font-size="16" font-weight="700" fill="#1f2328">
    <text x="588" y="51">63 %</text>
    <text x="296" y="96">14,4 %</text>
    <text x="258" y="141">8 %</text>
    <text x="240" y="186">5,1 %</text>
    <text x="221" y="231">1,8 %</text>
  </g>
  <g font-size="13" fill="#57606a" text-anchor="middle">
    <text x="200" y="270">0 %</text><text x="350" y="270">25 %</text>
    <text x="500" y="270">50 %</text><text x="650" y="270">75 %</text>
  </g>
  <text x="880" y="290" font-size="13" fill="#57606a" text-anchor="end">Daten: StatCounter Global Stats, 2023</text>
</svg>
