<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>CSS-Einheiten: px, %, em, rem, vh, vw</title>
  <rect width="900" height="340" fill="#0d1117"/>
  <g font-size="17" fill="#c9d1d9">
    <rect x="20" y="20" width="420" height="90" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="40" y="58" font-family="ui-monospace, Consolas, monospace" font-size="28" font-weight="700" fill="#f0883e">px</text>
    <text x="40" y="90">Absolute Pixelangabe</text>

    <rect x="460" y="20" width="420" height="90" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="480" y="58" font-family="ui-monospace, Consolas, monospace" font-size="28" font-weight="700" fill="#f0883e">%</text>
    <text x="480" y="90">Prozent der Größe des Elternelements</text>

    <rect x="20" y="125" width="420" height="90" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="40" y="163" font-family="ui-monospace, Consolas, monospace" font-size="28" font-weight="700" fill="#58a6ff">em</text>
    <text x="40" y="195">Relativ zur Schriftgröße des Elements</text>

    <rect x="460" y="125" width="420" height="90" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="480" y="163" font-family="ui-monospace, Consolas, monospace" font-size="28" font-weight="700" fill="#58a6ff">rem</text>
    <text x="480" y="195">Relativ zur Schriftgröße des Root-Elements (html)</text>

    <rect x="20" y="230" width="420" height="90" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="40" y="268" font-family="ui-monospace, Consolas, monospace" font-size="28" font-weight="700" fill="#3fb950">vh</text>
    <text x="40" y="300">1vh = 1 % der Höhe des Viewports</text>

    <rect x="460" y="230" width="420" height="90" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="480" y="268" font-family="ui-monospace, Consolas, monospace" font-size="28" font-weight="700" fill="#3fb950">vw</text>
    <text x="480" y="300">1vw = 1 % der Breite des Viewports</text>
  </g>
</svg>
