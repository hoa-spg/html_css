<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Main axis und cross axis eines Flex-Containers</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs>
  <rect width="720" height="340" fill="#ffffff"/>
  <rect x="120" y="90" width="420" height="150" rx="8" fill="#ddf4ff" stroke="#58a6ff" stroke-width="2.5"/>
  <rect x="140" y="115" width="170" height="100" rx="5" fill="#f0883e" stroke="#bc4c00" stroke-width="2"/>
  <rect x="330" y="115" width="170" height="100" rx="5" fill="#f0883e" stroke="#bc4c00" stroke-width="2"/>
  <text x="180" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="700">Item 1</text>
  <text x="370" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="700">Item 2</text>
  <line x1="80" y1="165.0" x2="590" y2="165.0" stroke="#cf222e" stroke-width="3" marker-end="url(#a)"/>
  <text x="595" y="170.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" text-anchor="start" fill="#cf222e" font-weight="700">main axis</text>
  <text x="120" y="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle" fill="#cf222e">main start</text>
  <text x="540" y="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle" fill="#cf222e">main end</text>
  <line x1="320" y1="50" x2="320" y2="300" stroke="#0969da" stroke-width="3" marker-end="url(#a)"/>
  <text x="328" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" text-anchor="start" fill="#0969da" font-weight="700">cross axis</text>
  <text x="550" y="95" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="start" fill="#0969da">cross start</text>
  <text x="550" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="start" fill="#0969da">cross end</text>
  <path d="M120,70 L540,70" stroke="#57606a" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="250.0" y="62" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle" fill="#57606a">main size</text>
  <path d="M95,90 L95,240" stroke="#57606a" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="85" y="153.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="end" fill="#57606a">cross size</text>
  <text x="420" y="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle" fill="#1f6feb" font-weight="700">Flex-Container</text>
</svg>
