<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 180" width="460" height="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Der Container umschließt die Flex-Kinder</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs>
  <rect width="460" height="180" fill="#ffffff"/>
  <rect x="30" y="70" width="400" height="90" rx="8" fill="#ddf4ff" stroke="#58a6ff" stroke-width="2.5"/>
  <rect x="45" y="85" width="100" height="60" rx="5" fill="#f0883e" stroke="#bc4c00" stroke-width="2"/>
  <rect x="157" y="85" width="130" height="60" rx="5" fill="#f0883e" stroke="#bc4c00" stroke-width="2"/>
  <rect x="299" y="85" width="100" height="60" rx="5" fill="#f0883e" stroke="#bc4c00" stroke-width="2"/>
  <text x="30" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" text-anchor="start" fill="#1f6feb" font-weight="700">Flex-Container</text>
  <text x="210" y="40" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="16" text-anchor="start" fill="#57606a">display: flex;</text>
  <path d="M90,46 C100,60 80,62 70,68" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#a)"/>
