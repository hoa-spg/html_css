<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
  <title>Die drei Kerntechnologien des Web: HTML, CSS und JavaScript</title>
  <rect width="520" height="220" fill="#ffffff"/>
  <!-- HTML: Struktur -->
  <rect x="20" y="20" width="150" height="150" rx="16" fill="#f0883e"/>
  <text x="95" y="90" font-family="ui-monospace, Consolas, monospace" font-size="40" font-weight="800" fill="#ffffff">&lt;/&gt;</text>
  <text x="95" y="140" font-size="30" font-weight="800" fill="#ffffff">HTML</text>
  <!-- CSS: Gestaltung -->
  <rect x="185" y="20" width="150" height="150" rx="16" fill="#58a6ff"/>
  <text x="260" y="90" font-family="ui-monospace, Consolas, monospace" font-size="40" font-weight="800" fill="#ffffff">{ }</text>
  <text x="260" y="140" font-size="30" font-weight="800" fill="#ffffff">CSS</text>
  <!-- JS: Verhalten -->
  <rect x="350" y="20" width="150" height="150" rx="16" fill="#e3b341"/>
  <text x="425" y="90" font-family="ui-monospace, Consolas, monospace" font-size="40" font-weight="800" fill="#1f2328">( )</text>
  <text x="425" y="140" font-size="30" font-weight="800" fill="#1f2328">JS</text>
  <g font-size="16" fill="#57606a">
    <text x="95" y="200">Struktur</text>
    <text x="260" y="200">Gestaltung</text>
    <text x="425" y="200">Verhalten</text>
  </g>
</svg>
