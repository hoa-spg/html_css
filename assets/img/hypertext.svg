<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Hypertext: Dokumente A bis F sind über Hyperlinks beliebig miteinander verknüpft</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
  </defs>
  <rect width="700" height="360" fill="#ffffff"/>
  <g transform="translate(20,20)">
      <rect width="150" height="100" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
      <g stroke="#d0d7de" stroke-width="4" stroke-linecap="round">
        <line x1="45" y1="24" x2="130" y2="24"/><line x1="20" y1="44" x2="130" y2="44"/>
        <line x1="20" y1="62" x2="130" y2="62"/><line x1="20" y1="80" x2="100" y2="80"/>
      </g>
  </g><g transform="translate(275,20)">
      <rect width="150" height="100" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
      <g stroke="#d0d7de" stroke-width="4" stroke-linecap="round">
        <line x1="45" y1="24" x2="130" y2="24"/><line x1="20" y1="44" x2="130" y2="44"/>
        <line x1="20" y1="62" x2="130" y2="62"/><line x1="20" y1="80" x2="100" y2="80"/>
      </g>
  </g><g transform="translate(530,20)">
      <rect width="150" height="100" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
      <g stroke="#d0d7de" stroke-width="4" stroke-linecap="round">
        <line x1="45" y1="24" x2="130" y2="24"/><line x1="20" y1="44" x2="130" y2="44"/>
        <line x1="20" y1="62" x2="130" y2="62"/><line x1="20" y1="80" x2="100" y2="80"/>
      </g>
  </g>
  <g transform="translate(20,230)">
      <rect width="150" height="100" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
      <g stroke="#d0d7de" stroke-width="4" stroke-linecap="round">
        <line x1="45" y1="24" x2="130" y2="24"/><line x1="20" y1="44" x2="130" y2="44"/>
        <line x1="20" y1="62" x2="130" y2="62"/><line x1="20" y1="80" x2="100" y2="80"/>
      </g>
  </g><g transform="translate(275,230)">
      <rect width="150" height="100" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
      <g stroke="#d0d7de" stroke-width="4" stroke-linecap="round">
        <line x1="45" y1="24" x2="130" y2="24"/><line x1="20" y1="44" x2="130" y2="44"/>
        <line x1="20" y1="62" x2="130" y2="62"/><line x1="20" y1="80" x2="100" y2="80"/>
      </g>
  </g><g transform="translate(530,230)">
      <rect width="150" height="100" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
      <g stroke="#d0d7de" stroke-width="4" stroke-linecap="round">
        <line x1="45" y1="24" x2="130" y2="24"/><line x1="20" y1="44" x2="130" y2="44"/>
        <line x1="20" y1="62" x2="130" y2="62"/><line x1="20" y1="80" x2="100" y2="80"/>
      </g>
  </g>
  <g font-size="22" font-weight="800" fill="#1f2328">
    <text x="34" y="50">A</text><text x="289" y="50">B</text><text x="544" y="50">C</text>
    <text x="34" y="260">D</text><text x="289" y="260">E</text><text x="544" y="260">F</text>
  </g>
  <!-- Links: Punkt im Text, Pfeil zum Ziel -->
  <g stroke="#0969da" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M120,64 L272,64"/>                <!-- A -> B -->
    <path d="M100,82 L282,236"/>              <!-- A -> E -->
    <path d="M60,100 L60,226"/>               <!-- A -> D -->
    <path d="M400,44 L527,44"/>               <!-- B -> C -->
    <path d="M580,122 L580,226"/>             <!-- C -> F -->
    <path d="M620,226 L620,122"/>             <!-- F -> C -->
    <path d="M530,290 L427,290"/>             <!-- F -> E -->
    <path d="M275,300 L172,300"/>             <!-- E -> D -->
  </g>
  <g fill="#0969da">
    <circle cx="120" cy="64" r="5"/><circle cx="100" cy="82" r="5"/><circle cx="60" cy="100" r="5"/>
    <circle cx="400" cy="44" r="5"/><circle cx="580" cy="122" r="5"/><circle cx="620" cy="230" r="5"/>
    <circle cx="530" cy="290" r="5"/><circle cx="275" cy="300" r="5"/>
