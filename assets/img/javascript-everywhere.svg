<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>JavaScript läuft überall: im Browser, auf dem Server, in mobilen Apps und in Desktop-Apps</title>
  <rect width="800" height="420" fill="#ffffff"/>
  <g stroke="#d29922" stroke-width="3" stroke-dasharray="7 6">
    <line x1="400" y1="210" x2="150" y2="95"/>
    <line x1="400" y1="210" x2="610" y2="160"/>
    <line x1="400" y1="210" x2="150" y2="325"/>
    <line x1="400" y1="210" x2="650" y2="325"/>
  </g>
  <!-- JS-Kern -->
  <rect x="330" y="140" width="140" height="140" rx="14" fill="#e3b341"/>
  <text x="456" y="262" text-anchor="end" font-size="64" font-weight="800" fill="#1f2328">JS</text>
  <text x="400" y="320" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">JavaScript everywhere</text>

  <!-- Browser -->
  <g transform="translate(70,40)">
    <rect width="160" height="110" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
    <rect width="160" height="24" rx="10" fill="#d0d7de"/>
    <rect y="14" width="160" height="10" fill="#d0d7de"/>
    <circle cx="16" cy="12" r="4" fill="#f85149"/><circle cx="30" cy="12" r="4" fill="#e3b341"/><circle cx="44" cy="12" r="4" fill="#3fb950"/>
    <rect x="16" y="38" width="128" height="10" rx="3" fill="#58a6ff"/>
    <rect x="16" y="56" width="90" height="8" rx="3" fill="#d0d7de"/>
    <rect x="16" y="70" width="110" height="8" rx="3" fill="#d0d7de"/>
    <text x="80" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Browser</text>
  </g>
  <!-- Server -->
  <g transform="translate(580,30)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
    <rect x="0" y="42" width="140" height="36" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
    <rect x="0" y="84" width="140" height="36" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
    <circle cx="20" cy="18" r="5" fill="#3fb950"/><circle cx="20" cy="60" r="5" fill="#3fb950"/><circle cx="20" cy="102" r="5" fill="#3fb950"/>
    <rect x="70" y="14" width="56" height="8" rx="3" fill="#d0d7de"/><rect x="70" y="56" width="56" height="8" rx="3" fill="#d0d7de"/><rect x="70" y="98" width="56" height="8" rx="3" fill="#d0d7de"/>
    <text x="70" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Server (Node.js)</text>
  </g>
  <!-- Mobile -->
  <g transform="translate(110,250)">
    <rect width="80" height="130" rx="14" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
    <rect x="10" y="18" width="60" height="90" rx="3" fill="#ddf4ff"/>
    <circle cx="40" cy="118" r="5" fill="none" stroke="#1f2328" stroke-width="2"/>
    <rect x="18" y="28" width="44" height="10" rx="3" fill="#58a6ff"/>
    <rect x="18" y="46" width="30" height="7" rx="3" fill="#8b949e"/>
    <text x="40" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Mobile</text>
  </g>
  <!-- Desktop -->
  <g transform="translate(580,262)">
    <rect width="140" height="90" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
    <rect x="10" y="10" width="120" height="70" rx="3" fill="#ddf4ff"/>
    <rect x="20" y="20" width="36" height="50" rx="2" fill="#a78bfa"/>
    <rect x="64" y="20" width="56" height="10" rx="2" fill="#58a6ff"/>
    <path d="M55,90 L50,106 L90,106 L85,90" fill="#d0d7de" stroke="#1f2328" stroke-width="2"/>
    <text x="70" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Desktop</text>
  </g>
</svg>
