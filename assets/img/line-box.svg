<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Alle Elemente sind inline; gestrichelte Linien zeigen Ober- und Unterkante der Line Box. Ein Element mit vertical-align: top sitzt oben</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
  </defs>
  <rect width="860" height="520" fill="#ffffff"/>
  <text x="430" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2328">Alle Elemente sind inline</text>
  <text x="430" y="70" text-anchor="middle" font-size="16" fill="#57606a">Gestrichelte Linien: Ober- und Unterkante der Line Box (Zeile)</text>
  <!-- Line Box -->
  <line x1="30" y1="110" x2="830" y2="110" stroke="#57606a" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="30" y1="290" x2="830" y2="290" stroke="#57606a" stroke-width="2" stroke-dasharray="7 6"/>
  <!-- Elemente auf der Grundlinie -->
  <rect x="60" y="130" width="120" height="140" fill="#58a6ff"/>
  <text x="250" y="270" font-size="60" font-weight="700" fill="#1f2328">Text</text>
  <rect x="410" y="190" width="80" height="80" fill="#58a6ff"/>
  <line x1="30" y1="270" x2="560" y2="270" stroke="#3fb950" stroke-width="2"/>
  <text x="520" y="262" text-anchor="end" font-size="15" font-weight="700" fill="#1a7f37">Grundlinie</text>
  <!-- vertical-align: top -->
  <rect x="600" y="110" width="200" height="60" fill="#a78bfa"/>
  <text x="700" y="147" text-anchor="middle" font-size="15" font-family="ui-monospace, Consolas, monospace" font-weight="700" fill="#ffffff">vertical-align: top</text>
  <!-- Erklärungen -->
  <line x1="200" y1="370" x2="130" y2="278" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/>
  <line x1="260" y1="370" x2="290" y2="282" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/>
  <line x1="320" y1="370" x2="440" y2="278" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/>
  <text x="260" y="400" text-anchor="middle" font-size="18" fill="#1f2328">Die anderen Elemente sitzen</text>
  <text x="260" y="424" text-anchor="middle" font-size="18" fill="#1f2328">standardmäßig auf der Grundlinie</text>
  <line x1="700" y1="370" x2="700" y2="180" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/>
  <text x="700" y="400" text-anchor="middle" font-size="18" fill="#1f2328">Dieses Element hat</text>
  <text x="700" y="424" text-anchor="middle" font-size="18" font-family="ui-monospace, Consolas, monospace" fill="#6e40c9">vertical-align: top</text>
</svg>
