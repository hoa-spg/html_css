<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Ein Selektor verbindet CSS-Regeln mit HTML-Elementen</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="600" height="350" fill="#ffffff"/>

  <!-- HTML-Elemente -->
  <text x="110" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">HTML-Elemente</text>
  <rect x="30" y="60" width="160" height="230" rx="10" fill="#fff4ec" stroke="#f0883e" stroke-width="2"/>
  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="15">
    <rect x="50" y="80" width="120" height="38" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <text x="110" y="104" text-anchor="middle" fill="#57606a">&lt;nav&gt;</text>
    <rect x="50" y="130" width="120" height="38" rx="6" fill="#58a6ff" stroke="#1f6feb" stroke-width="2"/>
    <text x="110" y="154" text-anchor="middle" fill="#ffffff" font-weight="700">&lt;h1&gt;</text>
    <rect x="50" y="180" width="120" height="38" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <text x="110" y="204" text-anchor="middle" fill="#57606a">&lt;p&gt;</text>
    <rect x="50" y="230" width="120" height="38" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <text x="110" y="254" text-anchor="middle" fill="#57606a">&lt;footer&gt;</text>
  </g>

  <!-- CSS-Regel -->
  <text x="450" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">CSS-Regel</text>
  <rect x="340" y="100" width="220" height="110" rx="10" fill="#1e2432"/>
  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="17">
    <rect x="356" y="116" width="34" height="28" rx="4" fill="#58a6ff" opacity="0.25"/>
    <text x="360" y="137" fill="#79c0ff" font-weight="700">h1</text>
    <text x="396" y="137" fill="#e6edf3">{</text>
    <text x="380" y="166" fill="#e6edf3"><tspan fill="#ffa657">color</tspan>: <tspan fill="#a5d6ff">navy</tspan>;</text>
    <text x="360" y="194" fill="#e6edf3">}</text>
  </g>

  <!-- Selektor-Pfeil -->
  <path d="M356,130 C290,100 250,120 178,146" fill="none" stroke="#1f2328" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="268" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6feb">Selektor</text>
  <text x="450" y="245" text-anchor="middle" font-size="13" fill="#57606a">Der Selektor bestimmt,</text>
  <text x="450" y="263" text-anchor="middle" font-size="13" fill="#57606a">welche Elemente die Regel trifft.</text>
</svg>
