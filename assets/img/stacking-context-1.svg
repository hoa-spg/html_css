<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>html-root bildet den Default-Stacking-Context, .foo einen eigenen, in dem .bar liegt</title>
  <rect width="880" height="660" fill="#ffffff"/>
  <!-- stacking context 1: html -->
  <rect x="20" y="20" width="840" height="540" rx="6" fill="#d0d7de"/>
  <text x="40" y="52" font-size="22" font-family="ui-monospace, Consolas, monospace" fill="#57606a">html</text>
  <!-- stacking context 2: .foo -->
  <rect x="140" y="70" width="600" height="440" rx="6" fill="#58a6ff"/>
  <text x="440" y="120" text-anchor="middle" font-size="30" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">.foo</text>
  <text x="440" y="150" text-anchor="middle" font-size="18" font-family="ui-monospace, Consolas, monospace" fill="#ffffff" opacity="0.9">z-index: 1</text>
  <!-- .bar -->
  <rect x="320" y="200" width="240" height="220" rx="6" fill="#3fb950"/>
  <text x="440" y="318" text-anchor="middle" font-size="30" font-family="ui-monospace, Consolas, monospace" fill="#ffffff">.bar</text>
  <!-- Legende -->
  <rect x="60" y="600" width="60" height="18" fill="#d0d7de"/>
  <text x="135" y="615" font-size="22" fill="#1f2328">stacking context 1</text>
  <rect x="480" y="600" width="60" height="18" fill="#58a6ff"/>
  <text x="555" y="615" font-size="22" fill="#1f2328">stacking context 2</text>
</svg>
