<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Aufbau einer URL: Protocol, Host, Path, Query String und Fragment</title>
  <rect width="1000" height="170" fill="#ffffff"/>
  <!-- Je Teil eine Box; Zeichenbreite unabhängig von der Schrift -->
  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="19" text-anchor="middle" fill="#1f2328">
    <rect x="20" y="40" width="110" height="50" rx="6" fill="#ffd8b5"/>
    <text x="75" y="73">https://</text>
    <rect x="134" y="40" width="186" height="50" rx="6" fill="#ddf4ff"/>
    <text x="227" y="73">example.com</text>
    <rect x="324" y="40" width="250" height="50" rx="6" fill="#dafbe1"/>
    <text x="449" y="73">/kurs/index.html</text>
    <rect x="578" y="40" width="210" height="50" rx="6" fill="#fbefff"/>
    <text x="683" y="73">?seite=2&amp;q=css</text>
    <rect x="792" y="40" width="188" height="50" rx="6" fill="#fff8c5"/>
    <text x="886" y="73">#kapitel-3</text>
  </g>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <text x="75" y="130" fill="#bc4c00">Protocol</text>
    <text x="227" y="130" fill="#0969da">Host</text>
    <text x="449" y="130" fill="#1a7f37">Path</text>
    <text x="683" y="130" fill="#8250df">Query String</text>
    <text x="886" y="130" fill="#9a6700">Fragment</text>
  </g>
  <g stroke-width="2.5" fill="none">
    <path d="M75,94 L75,110" stroke="#bc4c00"/><path d="M227,94 L227,110" stroke="#0969da"/>
    <path d="M449,94 L449,110" stroke="#1a7f37"/><path d="M683,94 L683,110" stroke="#8250df"/>
    <path d="M886,94 L886,110" stroke="#9a6700"/>
  </g>
</svg>
